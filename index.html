<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the navy hero paint into the iOS safe
         areas (behind Safari's bottom bar) so the landing reads as
         immersive rather than sitting above a white browser strip.
         theme-color tints the browser chrome to the hero navy. Sections
         that need to clear the bar pad with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1120" />

    <!-- Fonts. Loaded non-render-blocking via the standard preload -> swap-to
         -stylesheet pattern (rel=preload as=style + onload flips rel), so first
         paint (the inline splash) is never held up by a font request. Each is a
         high-priority preload, so the faces start downloading immediately and
         swap in fast via their fallback stacks. preconnect warms every origin
         first, including p.typekit.net which the Stolzl kit quietly pulls from.
         Stolzl (Adobe kit tpk0png, family "stolzl", Web Project "NZA Website")
         replaces the six self-hosted OTFs. See docs/briefs/active/fonts-adobe.md
         and docs/audit/mobile-load-diagnosis.md. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://use.typekit.net/tpk0png.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://use.typekit.net/tpk0png.css" />
    </noscript>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=DM+Serif+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=DM+Serif+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <title>Net Zero Advisory - specialists in buildings, energy and climate</title>

    <!-- Share cards. Crawlers do not run JS, so these live in the HTML, not in
         React. One shared set serves every route via the vercel.json rewrite.
         Deliberately no rel=canonical link (one would flag every route
         as a duplicate of /). The image URL is absolute - relative paths fail
         on every crawler. -->
    <meta name="description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Net Zero Advisory" />
    <meta property="og:url" content="https://netzeroadvisory.uk/" />
    <meta property="og:title" content="Net Zero Advisory" />
    <meta property="og:description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta property="og:image" content="https://netzeroadvisory.uk/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Net Zero Advisory" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Net Zero Advisory" />
    <meta name="twitter:description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta name="twitter:image" content="https://netzeroadvisory.uk/og-default.png" />

    <!--
      STATIC SPLASH - rendered the moment the HTML is parsed, BEFORE
      the JS bundle has loaded or React has mounted anything. Without
      this the user sees a blank screen for the duration of the JS
      fetch/parse - on mobile networks via Vercel that was ~15s for
      Chris. With this they immediately see the cream NZA splash and
      the static React preloader takes over the moment main.tsx
      finishes loading.

      The splash is removed by main.tsx the moment React mounts (just
      before the first render) so there's a clean handoff to the
      React-driven preloader animation.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #FAF7F0; }
      /* STATIC on purpose. A looping animation + position:fixed here made
         iOS Safari drop the rendered splash and go blank mid-load (Chris:
         "tiny logo, then blank"). No animation, absolute positioning, and a
         larger mark = a stable paint that iOS keeps on screen while the JS
         downloads. */
      #initial-splash {
        position: absolute;
        inset: 0;
        z-index: 99999;
        background: #FAF7F0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 24px;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #initial-splash svg {
        width: 116px;
        height: 116px;
      }
      #initial-splash .splash-label {
        font-size: 12px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(14, 17, 32, 0.5);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" aria-hidden="true">
      <!-- Real NZA mark - three nested triangles inside a circle.
           Verbatim from public/assets/logos/nza-mark-clean.svg so the
           static splash matches the brand mark Chris uses across the
           site rather than the simplified one-triangle stand-in that
           used to live here. -->
      <svg viewBox="0 0 300 298" xmlns="http://www.w3.org/2000/svg">
        <g fill="#0E1120">
          <path d="M169.48,166.16c-7.13-8.75-13.45-16.73-19.21-24.26-.2-.26-.58-.26-.78,0l-19.61,24.09c-.09.12-.24.18-.39.18h-9.27c-.42,0-.65-.49-.39-.82l29.88-36.38c.21-.25.59-.24.79.02l2.68,3.56c6.43,8.56,17.5,22.43,25.94,32.81.27.33.03.81-.39.81h-9.26.01Z"/>
          <path d="M250.35,213.07H50.7c-.42,0-.65-.48-.39-.81l99.3-124.12c.2-.25.58-.25.78,0l99.96,124.93h0ZM66.24,205.1h166.47c.42,0,.65-.48.39-.81l-82.72-103.39c-.2-.25-.58-.25-.78,0l-83.36,104.2h0Z"/>
          <path d="M250.35,167.05H50.7c-.42,0-.65-.48-.39-.81l99.3-124.12c.2-.25.58-.25.78,0l99.96,124.93h0ZM66.24,159.08h166.47c.42,0,.65-.48.39-.81l-82.72-103.39c-.2-.25-.58-.25-.78,0l-83.36,104.2h0Z"/>
          <path d="M149.99,279.63c-73.06,0-132.49-59.44-132.49-132.5S76.93,14.63,149.99,14.63s132.5,59.44,132.5,132.5-59.44,132.5-132.5,132.5h0ZM149.99,22.61c-68.66,0-124.52,55.86-124.52,124.52s55.86,124.52,124.52,124.52,124.52-55.86,124.52-124.52S218.66,22.61,150,22.61h0Z"/>
        </g>
      </svg>
      <span class="splash-label">Net Zero Advisory</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
