<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover lets the navy hero paint into the iOS safe
         areas (behind Safari's bottom bar) so the landing reads as
         immersive rather than sitting above a white browser strip.
         theme-color tints the browser chrome to the hero navy. Sections
         that need to clear the bar pad with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1120" />

    <!-- Fonts. Loaded non-render-blocking via the standard preload -> swap-to
         -stylesheet pattern (rel=preload as=style + onload flips rel), so first
         paint (the inline cream ground) is never held up by a font request. Each is a
         high-priority preload, so the faces start downloading immediately and
         swap in fast via their fallback stacks. preconnect warms every origin
         first, including p.typekit.net which the Stolzl kit quietly pulls from.
         Stolzl (Adobe kit tpk0png, family "stolzl", Web Project "NZA Website")
         replaces the six self-hosted OTFs. See docs/briefs/active/fonts-adobe.md
         and docs/audit/mobile-load-diagnosis.md. -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://use.typekit.net/tpk0png.css"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://use.typekit.net/tpk0png.css" />
    </noscript>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=DM+Serif+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&family=DM+Serif+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <title>Net Zero Advisory - specialists in buildings, energy and climate</title>

    <!-- Share cards. Crawlers do not run JS, so these live in the HTML, not in
         React. One shared set serves every route via the vercel.json rewrite.
         Deliberately no rel=canonical link (one would flag every route
         as a duplicate of /). The image URL is absolute - relative paths fail
         on every crawler. -->
    <meta name="description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Net Zero Advisory" />
    <meta property="og:url" content="https://netzeroadvisory.uk/" />
    <meta property="og:title" content="Net Zero Advisory" />
    <meta property="og:description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta property="og:image" content="https://netzeroadvisory.uk/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Net Zero Advisory" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Net Zero Advisory" />
    <meta name="twitter:description" content="Specialists in buildings, energy and climate. We work alongside your team to build tools that are tailored, intuitive, and yours to own." />
    <meta name="twitter:image" content="https://netzeroadvisory.uk/og-default.png" />

    <!--
      Cream ground from the first byte, so the moment before React mounts
      is the same cream as the preloader that follows - one loading page,
      not two. There used to be a static NZA-mark splash here to cover
      the JS download when that took ~15s on mobile; the bundle is small
      now and Chris asked for the splash to go ("we almost have two
      loading pages"). main.tsx still gates the React mount on the app
      stylesheet so the preloader never flashes unstyled.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #FAF7F0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
